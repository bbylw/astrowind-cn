site:
  name: AstroWind 中文站
  site: 'https://w404.nyc.mn' # GitHub Pages 账户自定义域名
  base: '/astrowind-cn' # 项目页子路径，不带尾斜杠；文章正文中的站内链接也需带此前缀
  trailingSlash: false

  googleSiteVerificationId: false

# 全站默认 SEO 元信息
metadata:
  title:
    default: AstroWind 中文站 — Astro v7 + Tailwind CSS v4 免费开源模板
    template: '%s — AstroWind 中文站'
  description: 'AstroWind 中文介绍站：了解这个基于 Astro v7 与 Tailwind CSS v4 的免费开源网站模板，包含 30+ 可组合页面区块、博客、SEO、暗色模式与多平台静态部署。'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: AstroWind 中文站
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@arthelokyo'
    site: '@arthelokyo'
    cardType: summary_large_image

i18n:
  language: zh-CN
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # 可用变量：%slug%、%year%、%month%、%day%、%category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # 或 "G-XXXXXXXXXX"

ui:
  theme: 'system' # 可选：system | light | dark | light:only | dark:only
